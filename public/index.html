<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Netflix</title>
  </head>
  <body>
    <section>
      <h2>Agregar nueva película</h2>
      <form id="formMovie">
        <div class="formFields">
          <label for="movieTitle">Nombre</label>
          <input type="text" id="movieTitle" required />
        </div>
        <div class="formFields">
          <label for="directorOfTheFilm">Director</label>
          <input type="text" id="directorOfTheFilm" required />
        </div>
        <div class="formFields">
          <label for="yearOfTheFilm">Año</label>
          <input type="number" id="yearOfTheFilm" required />
        </div>
        <button type="submit">AGREGAR NUEVA PELÍCULA</button>
      </form>
    </section>

    <script src="./js/client.js"></script>
  </body>
</html>
